site_name: spanguard
site_description: Detect and redact PII/PHI in text and streaming transcripts, with leak-free audit records.
site_url: https://clufy.github.io/spanguard/

repo_url: https://github.com/Clufy/spanguard
repo_name: Clufy/spanguard
edit_uri: edit/master/docs/

docs_dir: docs

# Maintainer-only files (local planning notes, the release runbook) stay off the site.
exclude_docs: |
  superpowers/
  plans/
  specs/
  PUBLISH-CHECKLIST.md

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    # NOTE: social cards plugin is intentionally NOT enabled — it requires
    # system cairo/pango libraries that may not be present in CI images.
    # Keeping it off keeps `mkdocs build --strict` green everywhere.

nav:
  - Getting started:
      - Home: index.md
      - Quickstart: quickstart.md
  - Guide:
      - Recognizers: recognizers.md
      - Streaming: streaming.md
      - CLI: cli.md
  - Reference:
      - API: api.md
      - Known limitations: known-limitations.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            docstring_style: google
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true

extra_css:
  - css/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Clufy/spanguard
      name: spanguard on GitHub
  generator: false
