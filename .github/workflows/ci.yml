name: CI
on:
  push: { branches: [master, main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv pip install --system -e ".[ner]" pytest pytest-cov ruff mypy
      - run: ruff check .
      - run: mypy
      - run: pytest --cov=spanguard --cov-report=term-missing --cov-fail-under=90
