name: CI
on:
  push: { branches: [master, main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[ner]" pytest pytest-cov ruff mypy
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --cov=spanguard --cov-report=term-missing --cov-fail-under=90

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # full history so gitleaks scans every commit
      - uses: gitleaks/gitleaks-action@v2
